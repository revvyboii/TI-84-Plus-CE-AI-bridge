name: Build calculator program

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get the CE C toolchain
        run: |
          mkdir -p "$HOME/cedev"
          curl -fsSL https://github.com/CE-Programming/toolchain/releases/latest/download/CEdev-Linux.tar.gz | tar -xz -C "$HOME/cedev"
          echo "$(dirname "$(find "$HOME/cedev" -name cedev-config -type f | head -n 1)")" >> "$GITHUB_PATH"

      - name: Build CLAUDE.8xp
        run: make -C calc

      - name: Get the CE libraries (clibs.8xg)
        continue-on-error: true
        run: curl -fsSL -o calc/bin/clibs.8xg https://github.com/CE-Programming/libraries/releases/latest/download/clibs.8xg

      - uses: actions/upload-artifact@v4
        with:
          name: send-these-to-your-calculator
          path: |
            calc/bin/CLAUDE.8xp
            calc/bin/clibs.8xg
