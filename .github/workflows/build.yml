name: Build calculator program

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get the CE C toolchain
        run: |
          mkdir -p "$HOME/cedev"
          curl -fsSL https://github.com/CE-Programming/toolchain/releases/latest/download/CEdev-Linux.tar.gz | tar -xz -C "$HOME/cedev"
          echo "$(dirname "$(find "$HOME/cedev" -name cedev-config -type f | head -n 1)")" >> "$GITHUB_PATH"

      - name: Build CLAUDE (chat with Claude)
        run: |
          mkdir -p out
          make -C calc
          cp calc/bin/CLAUDE.8xp out/

      - name: Build PHYS1, PHYS2, PHYS3 (solver + Ask AI) and PHL1, PHL2, PHL3 (solver only)
        run: |
          for part in 1 2 3; do
            make -C phys1 NAME=PHYS$part PART=$part AI=1
            cp phys1/bin/PHYS$part.8xp out/
            make -C phys1 NAME=PHYS$part clean
            make -C phys1 NAME=PHL$part PART=$part AI=0
            cp phys1/bin/PHL$part.8xp out/
            make -C phys1 NAME=PHL$part clean
          done
          ls -l out

      - name: Get the CE libraries (clibs.8xg)
        continue-on-error: true
        run: curl -fsSL -o out/clibs.8xg https://github.com/CE-Programming/libraries/releases/latest/download/clibs.8xg

      - uses: actions/upload-artifact@v4
        with:
          name: send-these-to-your-calculator
          path: out/
